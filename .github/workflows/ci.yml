name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            extra: -DNSCE_LTO=ON
          - name: asan-ubsan
            build_type: RelWithDebInfo
            extra: -DNSCE_LTO=OFF -DNSCE_SANITIZE=ON
          - name: tsan
            build_type: RelWithDebInfo
            extra: -DNSCE_LTO=OFF -DNSCE_TSAN=ON
    name: engine-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DNSCE_NATIVE=OFF
          -DNSCE_AVX2=OFF
          ${{ matrix.extra }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Exercise multithreaded UCI search
        run: printf 'uci\nsetoption name Threads value 4\nposition startpos\ngo depth 8\nquit\n' | ./build/nsce
